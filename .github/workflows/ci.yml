# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,snmp]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        # The integration tier needs simhall; it runs in the integration job below.
        run: python -m pytest -q -m "not integration" --timeout 90
      - name: Package builds
        run: |
          python -m pip install build
          python -m build --sdist --wheel

  integration:
    name: full suite with simhall (py${{ matrix.python }})
    # simhall is installed from the sibling repository, which the workflow token can only read once both
    # repositories are public; on a private repository this job is skipped.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,snmp]"
          python -m pip install "simhall @ git+https://github.com/turnup-dev/simhall@main"
      - name: Tests, integration tier included
        run: python -m pytest -q --timeout 300
